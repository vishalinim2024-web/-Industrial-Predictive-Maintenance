apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictive-maintenance-system
  namespace: production-monitoring
  labels:
    app: equipment-monitoring
    tier: frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: equipment-monitoring
  template:
    metadata:
      labels:
        app: equipment-monitoring
    spec:
      containers:
      - name: web-dashboard
        image: industrial/predictive-maintenance-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: predictive-maintenance-service
  namespace: production-monitoring
  labels:
    app: equipment-monitoring
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: equipment-monitoring
